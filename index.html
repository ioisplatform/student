    <!-- GitHub Pages Relative Path & SPA Redirect Normalizer -->
    <script type="text/javascript">
      // 1. Ensure trailing slash on GitHub Pages directory URLs (prevents ./assets/ 404 blank page)
      (function() {
        var p = window.location.pathname;
        if (p && !p.endsWith('/') && !p.includes('.')) {
          window.location.replace(p + '/' + window.location.search + window.location.hash);
        }
      })();

      // 2. Decode SPA query redirect from 404.html if refreshed
      (function(l) {
        if (l.search && l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
